plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1"
    id "me.shedaniel.unified-publishing"
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

architectury {
    platformSetupLoomIde()
    fabric()
}

sourceSets {
    main {
        java {
            exclude "dev/architectury/compat/fabric/ModMenuCompatibility.java"
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

repositories {
    maven { url "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    compileOnly "net.fabricmc:sponge-mixin:0.16.5+mixin.0.8.7"
    runtimeOnly "net.fabricmc:sponge-mixin:0.16.5+mixin.0.8.7"
    implementation "io.github.llamalad7:mixinextras-fabric:0.5.0"
    runtimeOnly "dev.architectury:architectury-injectables:1.0.10"
    runtimeOnly "org.ow2.asm:asm:9.8"
    runtimeOnly "org.ow2.asm:asm-analysis:9.8"
    runtimeOnly "org.ow2.asm:asm-commons:9.8"
    runtimeOnly "org.ow2.asm:asm-tree:9.8"
    runtimeOnly "org.ow2.asm:asm-util:9.8"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    // Architectury's production transform currently cannot read 26.1 / Java 25-era classpath entries.
    // Fall back to the shared named jar so Fabric packaging can complete.
    shadowCommon(project(path: ":common", configuration: "namedElements")) { transitive false }
}

processResources {
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
    inputs.property "version", project.version
}

shadowJar {
    enabled = false
}

remapJar {
    injectAccessWidener = false
    input.set jar.archiveFile
    dependsOn jar
    archiveClassifier = null
}

tasks.named("validateAccessWidener").configure {
    enabled = false
}

task renameJarForPublication(type: Zip, dependsOn: remapJar) {
    from remapJar.archiveFile.map { zipTree(it) }
    archiveExtension = "jar"
    metadataCharset "UTF-8"
    destinationDirectory = base.libsDirectory
    archiveClassifier = project.name
}

assemble.dependsOn renameJarForPublication

jar {
    archiveClassifier = "dev"
    dependsOn project(":common").classes
    from(project(":common").sourceSets.main.output) {
        exclude "architectury.accessWidener"
    }
}

sourcesJar {
    afterEvaluate {
        [":common"].forEach {
            def depSources = project(it).sourcesJar
            dependsOn depSources
            from(depSources.archiveFile.map { zipTree(it) }) {
                exclude "architectury.accessWidener"
            }
        }
    }
}

tasks.register("runClientNoTransform", JavaExec) {
    group = "loom"
    description = "Launch the Fabric dev client without Architectury Runtime transforms."

    dependsOn "classes", "configureClientLaunch", project(":common").tasks.named("classes")

    doFirst {
        def argFile = file("$buildDir/loom-cache/argFiles/runClient")
        def argLines = argFile.readLines("UTF-8")
        def excludedDevModules = [
                "fabric-data-generation-api-v1",
                "fabric-gametest-api-v1",
                "fabric-client-gametest-api-v1"
        ]
        def isLoaderBootstrapDependency = { File file ->
            def path = file.absolutePath
            path.contains("fabric-loader-") ||
                    path.contains("dev-launch-injector-") ||
                    path.contains("fabric-log4j-util-") ||
                    path.contains("sponge-mixin") ||
                    path.contains("mixinextras") ||
                    path.contains("${File.separator}asm-") ||
                    path.contains("architectury-injectables") ||
                    path.contains("mappings.jar") ||
                    path.contains("minecraft-merged-")
        }
        def isFabricModPath = { File file ->
            if (!file.exists()) {
                return false
            }

            if (file.directory) {
                return new File(file, "fabric.mod.json").exists() || new File(file, "quilt.mod.json").exists()
            }

            if (!file.name.endsWith(".jar")) {
                return false
            }

            def zip = new java.util.zip.ZipFile(file)
            try {
                zip.getEntry("fabric.mod.json") != null || zip.getEntry("quilt.mod.json") != null
            } finally {
                zip.close()
            }
        }
        def shouldKeepPath = { String path ->
            !path.contains("architectury-transformer-") &&
                    !path.endsWith("${java.io.File.separator}common${java.io.File.separator}build${java.io.File.separator}devlibs${java.io.File.separator}architectury-${project.version}-dev.jar") &&
                    excludedDevModules.every { !path.contains(it) }
        }
        def baseClasspath = []
        if (argLines.size() >= 2 && argLines[0] == "-classpath") {
            baseClasspath = argLines[1].split(java.io.File.pathSeparator).findAll(shouldKeepPath)
        }
        def runtimeClasspathFiles = configurations.runtimeClasspath.files.findAll { shouldKeepPath(it.absolutePath) }
        def commonRuntimeClasspathFiles = project(":common").configurations.runtimeClasspath.files.findAll { shouldKeepPath(it.absolutePath) }
        def allClasspathFiles = (runtimeClasspathFiles + commonRuntimeClasspathFiles + baseClasspath.collect { file(it) }).unique { it.absolutePath }
        def externalModFiles = allClasspathFiles.findAll { isFabricModPath(it) && !isLoaderBootstrapDependency(it) }
        def libraryClasspathFiles = allClasspathFiles.findAll { !externalModFiles.contains(it) }
        def isolatedModsDir = file("$buildDir/loom-cache/noTransformMods")

        delete isolatedModsDir
        mkdir isolatedModsDir

        copy {
            from externalModFiles
            into isolatedModsDir
        }

        classpath = files(
                sourceSets.main.output,
                project(":common").sourceSets.main.output,
                libraryClasspathFiles
        )

        systemProperty "fabric.dli.env", "client"
        systemProperty "fabric.dli.main", "net.fabricmc.loader.impl.launch.knot.KnotClient"
        systemProperty "fabric.dli.config", file(".gradle/loom-cache/launch.cfg").absolutePath
        systemProperty "fabric.defaultModDistributionNamespace", "official"
        systemProperty "fabric.modsFolder", isolatedModsDir.absolutePath
    }

    mainClass = "net.fabricmc.devlaunchinjector.Main"
    workingDir = file("run")
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archivesBaseName + "-fabric"
            from components.java
        }
    }

    repositories {
        if (System.getenv("MAVEN_PASS") != null) {
            maven {
                url = "https://deploy.shedaniel.me/"
                credentials {
                    username = "shedaniel"
                    password = System.getenv("MAVEN_PASS")
                }
            }
        }
    }
}

unifiedPublishing {
    project {
        displayName = "[Fabric $rootProject.supported_version] v$project.version"
        releaseType = "$rootProject.artifact_type"
        changelog = releaseChangelog()
        gameVersions = []
        gameLoaders = ["fabric"]
        mainPublication renameJarForPublication
        relations {
            depends {
                curseforge = "fabric-api"
                modrinth = "fabric-api"
            }
        }

        var CURSE_API_KEY = project.findProperty("CURSE_API_KEY") ?: System.getenv("CURSE_API_KEY")
        if (CURSE_API_KEY != null) {
            curseforge {
                token = CURSE_API_KEY
                id = rootProject.curseforge_id
                gameVersions.addAll "Java 25", project.minecraft_version
            }
        }

        var MODRINTH_TOKEN = project.findProperty("MODRINTH_TOKEN") ?: System.getenv("MODRINTH_TOKEN")
        if (MODRINTH_TOKEN != null) {
            modrinth {
                token = MODRINTH_TOKEN
                id = rootProject.modrinth_id
                version = "$project.version+$project.name"
                gameVersions.addAll project.minecraft_version
            }
        }
    }
}
