import java.text.SimpleDateFormat

buildscript {
    configurations.classpath {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
    }
}

plugins {
    id "architectury-plugin" version "3.5-SNAPSHOT"
    id "dev.architectury.loom-no-remap" version "1.17-SNAPSHOT" apply false
    id "com.gradleup.shadow" version "9.4.3" apply false
    id "com.github.hierynomus.license" version "0.16.1" apply false
    id "me.modmuss50.mod-publish-plugin" version "2.1.1" apply false
    id "maven-publish"
}

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    apply plugin: "java-library"
    apply plugin: "architectury-plugin"
    apply plugin: "com.github.hierynomus.license"

    group = rootProject.maven_group

    ext {
        isSnapshot = System.getenv("PR_NUM") != null
        runNumber = System.getenv("GITHUB_RUN_NUMBER") ?: "9999"
    }

    if (!ext.isSnapshot) {
        version = rootProject.base_version + "." + ext.runNumber + rootProject.version_suffix
        ext.archivesBaseName = rootProject.archives_base_name
    } else {
        version = rootProject.base_version + "-PR." + System.getenv("PR_NUM") + "." + ext.runNumber
        ext.archivesBaseName = rootProject.archives_base_name_snapshot
    }

    base {
        archivesName = archivesBaseName + "-$project.name"
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 25
    }

    // architectury-transformer 5.2.91 (the newest published) bundles an ASM that only understands
    // class files up to Java 26 (major 70). LWJGL 3.4.3, which MC 26.3 pulls in, is a multi-release
    // jar carrying Java 27 classes under META-INF/versions/27, and tiny-remapper reads every class
    // entry on the transformer classpath -- including versioned ones this JVM can never load -- so
    // the dev runtime dies with "Unsupported class file major version 71".
    // Hand the transformer copies of such jars with the unusable version trees stripped out. Only
    // "architectury.classpath" is rewritten, and that is a remap-analysis classpath, so the game
    // itself still runs against the untouched jars. Drop this once the transformer ships a newer ASM.
    tasks.withType(JavaExec).configureEach {
        def argPrefix = "-Darchitectury.properties="
        def patchedDir = new File(rootProject.layout.buildDirectory.get().asFile, "transformer-classpath")

        doFirst {
            def propertiesArg = jvmArgs.find { it.toString().startsWith(argPrefix) }
            if (propertiesArg == null) return

            def propertiesFile = new File(propertiesArg.toString().substring(argPrefix.length()))
            if (!propertiesFile.isFile()) return

            def properties = new Properties()
            propertiesFile.withInputStream { properties.load(it) }
            def classpath = properties.getProperty("architectury.classpath")
            if (classpath == null) return

            def runtimeFeature = Integer.parseInt(JavaVersion.current().majorVersion)
            def versioned = ~$/^META-INF/versions/(\d+)/.+/$
            def unusable = { java.util.zip.ZipEntry entry ->
                def matcher = versioned.matcher(entry.name)
                matcher.matches() && Integer.parseInt(matcher.group(1)) > runtimeFeature
            }

            def patchedAny = false
            def patchedClasspath = classpath.split(File.pathSeparator).collect { entry ->
                def jar = new File(entry)
                if (!jar.isFile() || !entry.toLowerCase().endsWith(".jar")) return entry
                if (!new java.util.zip.ZipFile(jar).withCloseable { zip -> Collections.list(zip.entries()).any(unusable) }) return entry

                patchedAny = true
                def patched = new File(patchedDir, jar.name)
                if (!patched.isFile() || patched.lastModified() < jar.lastModified()) {
                    patchedDir.mkdirs()
                    new java.util.zip.ZipFile(jar).withCloseable { zip ->
                        new java.util.zip.ZipOutputStream(patched.newOutputStream()).withCloseable { out ->
                            for (zipEntry in Collections.list(zip.entries())) {
                                if (unusable(zipEntry)) continue
                                out.putNextEntry(new java.util.zip.ZipEntry(zipEntry.name))
                                if (!zipEntry.directory) zip.getInputStream(zipEntry).withCloseable { out << it }
                                out.closeEntry()
                            }
                        }
                    }
                    logger.lifecycle("Stripped class files newer than Java $runtimeFeature out of $jar.name for the architectury transformer")
                }
                return patched.absolutePath
            }.join(File.pathSeparator)

            if (patchedAny) {
                properties.setProperty("architectury.classpath", patchedClasspath)
                propertiesFile.withOutputStream { properties.store(it, null) }
            }
        }
    }

    javadoc {
        // common javadoc has references to platform code that cannot be resolved normally
        failOnError = false
    }

    license {
        header = rootProject.file("HEADER")
        ext {
            name = "architectury"
            year = "2020, 2021, 2022"
        }
        include "**/*.java"
        exclude "**/NbtType.java"
        ignoreFailures = true
    }

    ext {
        releaseChangelog = {
            def dateFormat = new SimpleDateFormat("yyyy-MM-dd HH:mm")
            dateFormat.setTimeZone(TimeZone.getTimeZone("UTC"))
            def branch
            if (System.env.BRANCH_NAME) {
                branch = System.env.BRANCH_NAME
                branch = branch.substring(branch.lastIndexOf("/") + 1)
            } else {
                branch = "git rev-parse --abbrev-ref HEAD".execute().in.text.trim()
            }
            if (branch == "HEAD") {
                branch = "git rev-parse --short HEAD".execute().in.text.trim()
            }
            def time = dateFormat.format(new Date())
            def changes = new StringBuilder()
            changes << "## Architectury v$project.version for $project.supported_version\nUpdated at **$time**.\n[Click here for changelog](https://www.github.com/architectury/architectury/commits/$branch)"
            def proc = "git log --max-count=200 --pretty=format:%s".execute()
            proc.in.eachLine { line ->
                def processedLine = line.toString()
                if (!processedLine.contains("New translations") && !processedLine.contains("Merge") && !processedLine.contains("branch")) {
                    changes << "\n- ${processedLine.capitalize()}"
                }
            }
            proc.waitFor()
            return changes.toString()
        }
    }

    java {
        withSourcesJar()
    }
}

subprojects {
    apply plugin: "dev.architectury.loom-no-remap"

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.architectury.minecraft}"
    }

    repositories {
        maven { url "https://maven.neoforged.net/releases/" }
        if (rootProject.neoforge_pr != "") {
            maven {
                url "https://prmaven.neoforged.net/NeoForge/pr$rootProject.neoforge_pr"
                content {
                    includeModule("net.neoforged", "neoforge")
                }
            }
        }
    }
}

task licenseFormatAll
subprojects { p -> licenseFormatAll.dependsOn("${p.path}:licenseFormat") }
